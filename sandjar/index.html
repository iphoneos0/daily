<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5E4A86">
<title>Sand Jar · lulucard daily</title>
<meta name="build" content="d96a384">
<meta name="description" content="Drop the blocks. Join colors wall to wall. A free sand puzzle for your phone, tablet or computer.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sand Jar">
<meta property="og:description" content="Drop the blocks. Join colors wall to wall.">
<meta property="og:image" content="https://iphoneos0.com/daily/sandjar/og.jpg">
<meta property="og:url" content="https://iphoneos0.com/daily/sandjar/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<script>window.SAND_SITE = 'daily';</script>
<script src="../a.js"></script>
<script src="../ads.js"></script>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5E4A86; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif; }
  #cv { display: block; touch-action: none; }
  .ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(60, 45, 30, .35); }
  .hide { display: none; }
  /* 卡片和按钮跟着 A「日落海边」：奶白卡片、可可棕粗边、琥珀色胖按钮（docs/07） */
  .card { background: linear-gradient(#FFF7E8, #F6E3C6); border: 4px solid #4A2C1C; border-radius: 24px; padding: 28px 26px; min-width: 240px; max-width: 86vw; text-align: center; box-shadow: 0 6px 0 #4A2C1C, 0 14px 40px rgba(40, 10, 20, .35); }
  .card h2 { margin: 0 0 6px; font-size: 20px; color: #7A4A2C; font-weight: 800; }
  .big { font-size: 52px; font-weight: 900; color: #4A2C1C; margin: 4px 0; }
  .best { font-size: 14px; color: #8A5E40; font-weight: 700; margin-bottom: 18px; }
  .new { color: #E5452F; font-weight: 900; }
  button.go { font: 900 21px ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; color: #FFF4E2; background: linear-gradient(#FFB648, #E77A1E); border: 3px solid #4A2C1C; border-radius: 18px; padding: 13px 30px; box-shadow: 0 5px 0 #4A2C1C; cursor: pointer; text-shadow: 0 2px 0 #4A2C1C, 1px 0 0 #4A2C1C, -1px 0 0 #4A2C1C, 0 -1px 0 #4A2C1C; }
  button.go:active { transform: translateY(3px); box-shadow: 0 2px 0 #4A2C1C; }
  /* 结果卡片压在底盘的位置，瓶子里的沙画整个露出来 */
  #over { align-items: flex-end; background: rgba(40, 20, 30, .12); padding-bottom: calc(var(--sab) + 12px); }
  #over .card { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 10px 14px 10px 20px; text-align: left; border-radius: 20px; }
  #over h2 { font-size: 13px; margin: 0; }
  #over .big { font-size: 34px; margin: 0; line-height: 1.1; }
  #over .best { font-size: 13px; margin: 0; }
  #over button.go { padding: 12px 22px; font-size: 18px; white-space: nowrap; }
  #over .btns { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #over .more { font: 800 13px ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: #7A4A2C; text-decoration: underline; }
  #logSum { font-size: 13px; color: #5B4A3A; margin: 6px 0 10px; }
  #logTxt { width: 78vw; max-width: 520px; height: 46vh; font: 11px ui-monospace, monospace; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="over" class="ov hide"><div class="card">
  <div><h2>The jar is full</h2>
  <div class="big" id="ovScore">0</div>
  <div class="best" id="ovBest"></div></div>
  <div class="btns"><button class="go" id="again">Play again</button><a class="more hide" id="more" href="../">More games</a></div>
</div></div>
<div id="log" class="ov hide"><div class="card">
  <h2>Playtest log</h2>
  <div id="logSum"></div>
  <textarea id="logTxt" readonly></textarea><br><br>
  <button class="go" id="logCopy">Copy</button>
</div></div>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
